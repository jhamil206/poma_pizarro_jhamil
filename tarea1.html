<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 bg-light vh-100">
                <nav class="nav nav-pills flex-column p-3">
                    <a class="nav-link active" id="ventana1-tab" data-bs-toggle="tab" href="#ventana1" role="tab" aria-controls="ventana1" aria-selected="true">Ventana 1</a>
                    <a class="nav-link" id="ventana2-tab" data-bs-toggle="tab" href="#ventana2" role="tab" aria-controls="ventana2" aria-selected="false">Ventana 2</a>
                    <a class="nav-link" id="ventana3-tab" data-bs-toggle="tab" href="#ventana3" role="tab" aria-controls="ventana3" aria-selected="false">Ventana 3</a>
                </nav>
            </div>
            <!-- Área de Contenido -->
            <div class="col-md-9">
                <div class="tab-content p-3">
                    <div class="tab-pane fade show active" id="ventana1" role="tabpanel" aria-labelledby="ventana1-tab">
                        <h1>Inicio Ventana 1</h1>
                        <p>Contenido de la Ventana 1.</p>
                    </div>
                    <div class="tab-pane fade" id="ventana2" role="tabpanel" aria-labelledby="ventana2-tab">
                        <h1>Inicio Ventana 2</h1>
                        <p>Contenido de la Ventana 2.</p>
                    </div>
                    <div class="tab-pane fade" id="ventana3" role="tabpanel" aria-labelledby="ventana3-tab">
                        <h1>Inicio Ventana 3</h1>
                        <p>Contenido de la Ventana 3.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
