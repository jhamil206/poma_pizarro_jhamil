<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- Navbar Superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Dashboard Admin</a>
      <div class="d-flex">
        <button class="btn btn-outline-light me-2" type="button">
          <i class="bi bi-bell"></i> Notificaciones
        </button>
        <button class="btn btn-outline-light" type="button">
          <i class="bi bi-person-circle"></i> Perfil
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar Lateral -->
      <div class="col-12 col-md-3 bg-light vh-100 sidebar">
        <nav class="nav nav-pills flex-column p-3">
          <a class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" href="#dashboard" role="tab">
            <i class="bi bi-house-door"></i> Dashboard
          </a>
          <a class="nav-link" id="usuarios-tab" data-bs-toggle="tab" href="#usuarios" role="tab">
            <i class="bi bi-people"></i> Usuarios
          </a>
          <a class="nav-link" id="configuracion-tab" data-bs-toggle="tab" href="#configuracion" role="tab">
            <i class="bi bi-gear"></i> Configuración
          </a>
        </nav>
      </div>

      <!-- Área de Contenido -->
      <div class="col-12 col-md-9 content">
        <div class="tab-content p-3">
          <!-- Dashboard -->
          <div class="tab-pane fade show active" id="dashboard" role="tabpanel">
            <h1>Dashboard</h1>
            <div class="row">
              <div class="col-md-4">
                <div class="card shadow-sm">
                  <div class="card-body text-center">
                    <h5 class="card-title">Usuarios Activos</h5>
                    <p class="fs-3 text-primary fw-bold">150</p>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card shadow-sm">
                  <div class="card-body text-center">
                    <h5 class="card-title">Proyectos</h5>
                    <p class="fs-3 text-success fw-bold">25</p>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card shadow-sm">
                  <div class="card-body text-center">
                    <h5 class="card-title">Tareas Pendientes</h5>
                    <p class="fs-3 text-danger fw-bold">10</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Usuarios -->
          <div class="tab-pane fade" id="usuarios" role="tabpanel">
            <h1>Usuarios</h1>
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Nombre</th>
                  <th>Email</th>
                  <th>Rol</th>
                </tr>
              </thead>
              <tbody>
                <tr><td>1</td><td>Juan Pérez</td><td>juan@example.com</td><td>Admin</td></tr>
                <tr><td>2</td><td>María García</td><td>maria@example.com</td><td>Usuario</td></tr>
                <tr><td>3</td><td>Carlos López</td><td>carlos@example.com</td><td>Usuario</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Configuración -->
          <div class="tab-pane fade" id="configuracion" role="tabpanel">
            <h1>Configuración</h1>
            <button class="btn btn-primary">
              <i class="bi bi-gear"></i> Ajustes
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
